name: Link Check

on:
  # Verify links on every change to the list or to the checker's own config
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'lychee.toml'
      - '.github/workflows/link-check.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'lychee.toml'
      - '.github/workflows/link-check.yml'
  # Catch link rot: full sweep every Monday at 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          output: ./lychee/out.md
          format: markdown
          jobSummary: true
          fail: false
        env:
          # Raises GitHub API rate limits so github.com links aren't false positives
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On the weekly scheduled run, open (or update) an issue listing broken links.
      # Only for exit code 2 (genuine link failures) -- a config error must never
      # masquerade as link rot.
      - name: Open issue for broken links
        if: steps.lychee.outputs.exit_code == 2 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Broken links detected by weekly link check'
          content-filepath: ./lychee/out.md
          labels: |
            broken-links
            automated

      # Fail the job on any non-zero exit, but say which kind of failure it was
      # and print the offending URLs straight into the log, so diagnosing a
      # failure never requires opening the job summary.
      # lychee: 1 = runtime/input error, 2 = broken links, 3 = bad config file.
      - name: Evaluate lychee result
        if: steps.lychee.outputs.exit_code != 0
        env:
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          if [ -f ./lychee/out.md ]; then
            echo "----- lychee report -----"
            cat ./lychee/out.md
            echo "----- end report -----"
          else
            echo "No report file was produced at ./lychee/out.md"
          fi

          case "$LYCHEE_EXIT_CODE" in
            1) echo "::error::lychee runtime or input error (not a broken link)." ;;
            2) echo "::error::Broken links detected. The failing URLs are listed above." ;;
            3) echo "::error::Invalid lychee.toml -- no links were checked." ;;
            *) echo "::error::Unexpected lychee exit code: $LYCHEE_EXIT_CODE" ;;
          esac
          exit 1
